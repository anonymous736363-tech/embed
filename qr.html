<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code OBS Stream - Semi Transparan</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Latar belakang transparan khusus untuk OBS */
            background-color: transparent; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .qr-container {
            position: relative;
            width: 220px;
            height: 270px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        /* Animasi garis berputar (Neon Cyan) */
        .qr-container::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(transparent, transparent, transparent, #00ffff);
            animation: rotate 4s linear infinite;
        }

        /* Animasi garis berputar (Neon Pink) */
        .qr-container::after {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(transparent, transparent, transparent, #ff00ff);
            animation: rotate 4s linear infinite;
            animation-delay: -2s;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Kotak bagian dalam - Dibuat Opacity 50% */
        .qr-content {
            position: absolute;
            inset: 4px; /* Ketebalan border neon */
            background: rgba(17, 17, 17, 0.5); /* Background hitam dengan opacity 50% */
            backdrop-filter: blur(5px); /* Efek kaca buram (opsional, sangat bagus untuk OBS) */
            border-radius: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .qr-image {
            width: 150px;
            height: 150px;
            background: white; /* Biarkan putih agar QR tetap bisa di-scan */
            border-radius: 10px;
            padding: 8px;
            object-fit: contain;
        }

        .scan-text {
            margin-top: 15px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 5px #00ffff, 0 0 15px #ff00ff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <div class="qr-content">
            <!-- Ganti URL pada bagian src dengan link gambar QR Code asli Anda -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Trakteer/Saweria_Link_Disini" alt="QR Code" class="qr-image">
            <div class="scan-text">SCAN ME</div>
        </div>
    </div>
</body>
</html>
